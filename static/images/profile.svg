<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />

  <!-- Outer Glowing Ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" opacity="0.8" />
  
  <!-- Profile Avatar Container -->
  <circle cx="200" cy="180" r="100" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Head & Shoulders Silhouette -->
  <g fill="url(#primaryGrad)">
    <!-- Head -->
    <circle cx="200" cy="140" r="45" />
    <!-- Shoulders -->
    <path d="M110 260 C110 200, 290 200, 290 260 C290 270, 110 270, 110 260 Z" />
  </g>

  <!-- Code Symbol Overlay -->
  <g transform="translate(140, 310)" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 10 5 25 20 40" />
    <line x1="35" y1="5" x2="25" y2="45" />
    <polyline points="40 10 55 25 40 40" />
  </g>
</svg>
